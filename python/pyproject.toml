[build-system]
requires = [
    "scikit-build-core==1.1.1",
    "pybind11==3.1.0",
    "tomli==2.2.1; python_version < '3.11'",
]
build-backend = "release_backend"
backend-path = ["build_backend"]

[project]
name = "EqnEdit64"
version = "3.1.8"
description = "TeX equation tools with a signed standalone Windows EXE and Office clipboard support"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT AND BSD-3-Clause AND LicenseRef-GUST-Font"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/*"]
authors = [{name = "Kengo Sugahara"}]
keywords = ["tex", "latex", "equation", "mathml", "powerpoint", "office"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
test = ["build==1.6.1", "pytest==9.1.1"]
render-test = ["pymupdf>=1.24.3"]

[project.urls]
Homepage = "https://github.com/ksugahar/EqnEdit64"
Repository = "https://github.com/ksugahar/EqnEdit64"
Issues = "https://github.com/ksugahar/EqnEdit64/issues"

[project.scripts]
eqnedit64 = "eqnedit64.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/eqnedit64"]
build-dir = "build/{wheel_tag}"
