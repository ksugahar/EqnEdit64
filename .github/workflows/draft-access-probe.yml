name: Draft access probe
'on':
  workflow_dispatch:
    inputs:
      release_id:
        required: true
        type: string
      asset_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      asset_sha256:
        required: true
        type: string
permissions: {}
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Probe draft access once
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_RELEASE_ID: ${{ inputs.release_id }}
          PROBE_ASSET_ID: ${{ inputs.asset_id }}
          PROBE_SOURCE_SHA: ${{ inputs.source_sha }}
          PROBE_ASSET_SHA256: ${{ inputs.asset_sha256 }}
        run: |
          python tools/probe_draft_access.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve probe evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: draft-access-probe
          path: draft-access-probe.json
          if-no-files-found: error
