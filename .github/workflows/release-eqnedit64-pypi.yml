name: Release Eqnedit64 to PyPI
'on':
  workflow_run:
    workflows:
    - Eqnedit64
    types:
    - completed
permissions:
  actions: read
  contents: read
jobs:
  qualify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.context.outputs.eligible }}
      sha: ${{ steps.context.outputs.sha }}
      tag: ${{ steps.context.outputs.tag }}
    steps:
    - name: Download exact Eqnedit64 CI ref context
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: eqnedit64-ci-release-context
        path: eqnedit64-ci-release-context
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Verify triggering CI ran on an Eqnedit64 release tag
      id: context
      env:
        SHA: ${{ github.event.workflow_run.head_sha }}
        RUN_ID: ${{ github.event.workflow_run.id }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import pathlib
        import re
        import sys

        context = json.loads(pathlib.Path(
            "eqnedit64-ci-release-context/context.json"
        ).read_text(encoding="utf-8"))
        if context.get("schema") != "eqnedit64.ci-release-context.v1":
            print("::error::Unknown Eqnedit64 CI release-context schema")
            sys.exit(1)
        if (context.get("repository") != os.environ["GITHUB_REPOSITORY"] or
                context.get("sha") != os.environ["SHA"] or
                str(context.get("run_id")) != os.environ["RUN_ID"]):
            print("::error::Eqnedit64 CI context does not match workflow_run")
            sys.exit(1)

        ref = context.get("ref", "")
        tag = ref.removeprefix("refs/tags/")
        eligible = (
            context.get("ref_type") == "tag" and
            re.fullmatch(r"v\d+\.\d+\.\d+", tag) is not None
        )
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"eligible={str(eligible).lower()}\n")
            output.write(f"sha={context['sha']}\n")
            output.write(f"tag={tag if eligible else ''}\n")
        print(f"Eqnedit64 CI ref: {ref} (eligible={eligible})")
        PY
  # Signed assets are staged separately; this hosted job only verifies them
  signed-standalone:
    needs: qualify
    if: needs.qualify.outputs.eligible == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.qualify.outputs.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Download the signed standalone prepared for this tag
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EQNEDIT64_TAG: ${{ needs.qualify.outputs.tag }}
        EQNEDIT64_SHA: ${{ needs.qualify.outputs.sha }}
      run: |
        $version = $env:EQNEDIT64_TAG.Substring('v'.Length)
        $dest = Join-Path $env:RUNNER_TEMP 'eqnedit64-draft'
        New-Item -ItemType Directory -Path $dest | Out-Null
        # Download canonical names from the unpublished, exact-SHA draft.
        foreach ($item in @(@("Eqnedit64.exe", 100000),
                            @("Eqnedit64.release.json", 1),
                            @("SHA256SUMS.txt", 1))) {
          $name = $item[0]
          python tools/download_release_asset.py `
            --repo $env:GITHUB_REPOSITORY `
            --tag $env:EQNEDIT64_TAG `
            --source-sha $env:EQNEDIT64_SHA `
            --name $name `
            --min-size $item[1] `
            --dest $dest
          if ($LASTEXITCODE -ne 0) {
            throw ("The signed standalone for $env:EQNEDIT64_TAG is not staged: " +
              "$name is missing from the exact unpublished draft. " +
              'Stage the signed candidate before creating the release tag.')
          }
        }
    - name: Verify the signed standalone against the tag
      shell: pwsh
      env:
        EQNEDIT64_TAG: ${{ needs.qualify.outputs.tag }}
        EQNEDIT64_SHA: ${{ needs.qualify.outputs.sha }}
        EQNEDIT64_SIGNER_SHA256: ${{ secrets.EQNEDIT64_SIGNER_SHA256 }}
      run: |
        $releaseRoot = Join-Path $env:RUNNER_TEMP 'eqnedit64-draft'
        $exe = Join-Path $releaseRoot 'Eqnedit64.exe'
        $manifestPath = Join-Path $releaseRoot 'Eqnedit64.release.json'
        Write-Host "Verifying staged release payload: $releaseRoot"
        $manifest = Get-Content -LiteralPath $manifestPath -Raw |
          ConvertFrom-Json
        $allowedKeys = @('schema', 'repository', 'tag', 'version', 'source_sha', 'exe_sha256')
        $actualKeys = @($manifest.PSObject.Properties.Name)
        if (@(Compare-Object $allowedKeys $actualKeys).Count -ne 0) {
          throw 'Unexpected manifest fields; private metadata must not be published'
        }
        $expectedVersion = $env:EQNEDIT64_TAG.Substring('v'.Length)
        $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
        $actualVersion = (Get-Item -LiteralPath $exe).VersionInfo.ProductVersion
        $signature = Get-AuthenticodeSignature -LiteralPath $exe
        $pin = $env:EQNEDIT64_SIGNER_SHA256
        if ($pin -notmatch '^[0-9A-Fa-f]{64}$') { throw 'Signer SHA256 setting required' }
        $actualPin = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($signature.SignerCertificate.RawData))
        if ($actualPin -cne $pin.ToUpperInvariant()) { throw 'Signer certificate mismatch' }
        $store = [Security.Cryptography.X509Certificates.X509Store]::new('Root', 'LocalMachine')
        try {
          $store.Open('ReadWrite')
          $store.Add($signature.SignerCertificate)
        } finally { $store.Close() }
        $signature = Get-AuthenticodeSignature -LiteralPath $exe
        if ($signature.Status -ne 'Valid') { throw 'Invalid staged signature after pinned trust setup' }

        if ($manifest.schema -cne 'eqnedit64.staged-release.v1' -or
            $manifest.tag -cne $env:EQNEDIT64_TAG -or
            $manifest.version -cne $expectedVersion -or
            $manifest.source_sha -cne $env:EQNEDIT64_SHA -or
            $manifest.exe_sha256 -cne $actualHash -or
            $actualVersion -cne $expectedVersion -or
            $manifest.repository -cne $env:GITHUB_REPOSITORY) {
          throw ('The staged signed Eqnedit64 does not match this tag. ' +
            'It must be the executable compiled and signed from the exact ' +
            'tagged commit, staged by the maintainer signing step before the release tag.')
        }

        $artifact = Join-Path $env:RUNNER_TEMP 'eqnedit64-signed-standalone'
        New-Item -ItemType Directory -Path $artifact | Out-Null
        Copy-Item -LiteralPath $exe -Destination $artifact
        Copy-Item -LiteralPath $manifestPath -Destination $artifact
        $stagedChecksum = Get-Content -LiteralPath (Join-Path $releaseRoot 'SHA256SUMS.txt') -Raw
        if ($stagedChecksum.Trim() -cne ($actualHash.ToLowerInvariant() + '  Eqnedit64.exe')) { throw 'Staged checksum mismatch' }
        Copy-Item -LiteralPath (Join-Path $releaseRoot 'SHA256SUMS.txt') -Destination $artifact
    - name: Reject development labels in staged release artifacts
      shell: pwsh
      run: |
        python tools/release_version.py --check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $releaseRoot = Join-Path $env:RUNNER_TEMP 'eqnedit64-draft'
        python tools/check_release_versions.py --artifact "$releaseRoot/Eqnedit64.exe" --artifact "$releaseRoot/Eqnedit64.release.json" --artifact web/equation-editor.js --artifact web/equation-editor.fragment.html
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Upload exact signed standalone artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: eqnedit64-signed-standalone
        path: ${{ runner.temp }}/eqnedit64-signed-standalone/*
        if-no-files-found: error
    permissions:
      contents: write
      actions: read
  build-wheels:
    needs:
    - qualify
    - signed-standalone
    if: needs.qualify.outputs.eligible == 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python-version:
        - '3.10'
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.qualify.outputs.sha }}
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ matrix.python-version }}
    - name: Download exact pre-tag signed artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: eqnedit64-signed-standalone
        path: ${{ runner.temp }}/eqnedit64-release
    - name: Verify signed standalone artifact
      env:
        EQNEDIT64_SIGNER_SHA256: ${{ secrets.EQNEDIT64_SIGNER_SHA256 }}
      shell: pwsh
      run: |
        $directory = Join-Path $env:RUNNER_TEMP 'eqnedit64-release'
        $exe = Join-Path $directory 'Eqnedit64.exe'
        $checksums = Join-Path $directory 'SHA256SUMS.txt'
        $line = Get-Content -LiteralPath $checksums |
          Where-Object { $_ -match 'Eqnedit64\.exe$' } | Select-Object -First 1
        if (-not $line) { throw 'Eqnedit64.exe checksum is missing' }
        $expected = ($line -split '\s+')[0].ToUpperInvariant()
        $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash
        if ($actual -ne $expected) {
          throw "SHA-256 mismatch: $actual != $expected"
        }
        $signature = Get-AuthenticodeSignature -LiteralPath $exe
        $pin = $env:EQNEDIT64_SIGNER_SHA256
        if ($pin -notmatch '^[0-9A-Fa-f]{64}$') { throw 'Signer SHA256 setting required' }
        $actualPin = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($signature.SignerCertificate.RawData))
        if ($actualPin -cne $pin.ToUpperInvariant()) { throw 'Signer certificate mismatch' }
        $store = [Security.Cryptography.X509Certificates.X509Store]::new('Root', 'LocalMachine')
        try {
          $store.Open('ReadWrite')
          $store.Add($signature.SignerCertificate)
        } finally { $store.Close() }
        $signature = Get-AuthenticodeSignature -LiteralPath $exe
        if ($signature.Status -ne 'Valid') { throw 'Invalid staged signature after pinned trust setup' }

        "EQNEDIT64_RELEASE_EXE=$exe" |
          Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    - name: Install wheel build and version parser dependencies
      run: |
        python -m pip install -r ci-requirements.txt
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Verify generated release version text
      run: |
        python tools/release_version.py --check
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - name: Validate tag and package versions
      env:
        EQNEDIT64_TAG: ${{ needs.qualify.outputs.tag }}
      shell: pwsh
      run: |
        $line = Select-String -LiteralPath python\pyproject.toml `
          -Pattern '^version\s*=\s*"([^"]+)"$' | Select-Object -First 1
        if (-not $line) { throw 'eqnedit64 package version is missing' }
        $version = $line.Matches[0].Groups[1].Value
        if ($env:EQNEDIT64_TAG -cne "v$version") {
          throw "tag/package mismatch: $env:EQNEDIT64_TAG != v$version"
        }
    - name: Build wheel
      run: |
        python -m build --wheel python
    - name: Verify installed wheel outside the repository
      shell: pwsh
      run: |
        $wheel = Get-ChildItem python\dist\eqnedit64-*.whl |
          Select-Object -First 1
        $target = Join-Path $env:RUNNER_TEMP 'eqnedit64-wheel-test'
        python -m pip install --target $target $wheel.FullName
        $env:PYTHONPATH = $target
        Push-Location $env:RUNNER_TEMP
        try {
          python "$env:GITHUB_WORKSPACE\python\tests\verify_installed.py"
        } finally {
          Pop-Location
        }
    - name: Inspect exact built wheel and embedded executable before upload
      shell: pwsh
      run: |
        $wheel = Get-ChildItem python/dist/eqnedit64-*.whl | Select-Object -First 1
        python tools/check_release_versions.py --artifact $wheel.FullName --artifact $env:EQNEDIT64_RELEASE_EXE
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        python tests/check_public_names.py --artifact $wheel.FullName --artifact $env:EQNEDIT64_RELEASE_EXE
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: eqnedit64-wheel-${{ matrix.python-version }}
        path: python/dist/*.whl
        if-no-files-found: error
  publish:
    needs:
    - qualify
    - signed-standalone
    - build-wheels
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ needs.qualify.outputs.sha }}
        persist-credentials: false
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: eqnedit64-wheel-*
        path: dist
        merge-multiple: true
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: eqnedit64-signed-standalone
        path: standalone
    - name: Verify all draft assets before any publication
      id: draft
      env:
        GH_TOKEN: ${{ github.token }}
        EQNEDIT64_TAG: ${{ needs.qualify.outputs.tag }}
        EQNEDIT64_SHA: ${{ needs.qualify.outputs.sha }}
      run: |
        python tools/verify_draft_assets.py --repo "$GITHUB_REPOSITORY" --tag "$EQNEDIT64_TAG" --source-sha "$EQNEDIT64_SHA" \
          --artifact-dir standalone --output "$GITHUB_OUTPUT"
    - name: Reject development labels before publication
      run: |
        set -euo pipefail
        python tools/release_version.py --check
        args=(--artifact standalone/Eqnedit64.exe --artifact standalone/Eqnedit64.release.json --artifact web/equation-editor.js --artifact web/equation-editor.fragment.html)
        for wheel in dist/*.whl; do args+=(--artifact "$wheel"); done
        python tools/check_release_versions.py "${args[@]}"
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
      with:
        packages-dir: dist/
        skip-existing: false
    - name: Publish the preverified draft GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        DRAFT_RELEASE_ID: ${{ steps.draft.outputs.release_id }}
      run: |
        set -euo pipefail
        printf '%s' '{"draft":false,"prerelease":false,"make_latest":"true"}' |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$DRAFT_RELEASE_ID" --input - > /dev/null
concurrency:
  group: eqnedit64-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
